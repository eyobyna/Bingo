<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Meznagna Bingo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --hall:#2A1B3D; --hall-deep:#1D1230; --paper:#EAF4EC; --ink:#1B1B2F;
  --dauber:#E6007E; --ball:#FFC93C; --muted:#B9A9D1; --win:#14A76C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--hall-deep);color:var(--paper);font-family:'Nunito',system-ui,sans-serif;font-weight:600}
body{display:flex;justify-content:center}
[hidden]{display:none!important}
#app{width:100%;max-width:480px;height:100dvh;padding:8px 12px 12px;display:flex;flex-direction:column;gap:8px;background:var(--hall)}

.brand{text-align:center;line-height:1.2}
.brand-am{font-size:26px;font-weight:800;color:var(--ball)}
.brand-motto{font-size:14px;color:var(--paper);margin-top:1px}
.brand-motto-en{font-size:12px;color:var(--muted);margin-top:1px}

.infobar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-weight:800}
.infobar #timer{color:var(--ball);font-size:15px}
.greet{text-align:center;font-weight:800;font-size:15px;min-height:20px}

.screen{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px}

/* caller */
.caller{display:flex;align-items:center;gap:14px;flex:none}
.ball{width:68px;height:68px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE79A 0,var(--ball) 55%,#E0A41A 100%);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Bowlby One',sans-serif;line-height:1;box-shadow:0 4px 0 #9A6B00}
.ball small{font-size:14px}
.ball b{font-size:26px;font-weight:400}
.ball.empty{background:var(--hall-deep);box-shadow:none;border:3px dashed var(--muted);color:var(--muted);font-size:11px;font-family:'Nunito',sans-serif;font-weight:800;text-align:center}
.ball.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.callinfo{flex:1;min-width:0}
.callinfo .count{font-size:13px;color:var(--muted);margin-bottom:4px}
.recent{display:flex;gap:5px;flex-wrap:nowrap;min-height:28px}
.recent span{background:var(--hall-deep);border:2px solid var(--ball);color:var(--ball);border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}

/* card */
.cardbox{width:clamp(250px,calc((100dvh - 350px) / 1.2),100%);align-self:center;flex:none}
.cardbox.sm{width:min(100%,300px)}
.card{background:var(--paper);color:var(--ink);border-radius:14px;padding:8px;box-shadow:0 5px 0 var(--hall-deep);container-type:inline-size;width:100%}
.head,.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.head{margin-bottom:4px}
.head div{font-family:'Bowlby One',sans-serif;font-size:clamp(18px,8cqw,28px);text-align:center;color:var(--dauber);line-height:1.1}
.cell{position:relative;aspect-ratio:1;border:0;border-radius:10px;background:#fff;color:var(--ink);font-family:inherit;font-weight:800;font-size:clamp(14px,7.5cqw,26px);box-shadow:inset 0 0 0 2px #CFE0D3;display:flex;align-items:center;justify-content:center;padding:0}
button.cell{cursor:pointer;transition:transform .08s}
button.cell:active{transform:scale(.94)}
.cell.called:not(.marked){box-shadow:inset 0 0 0 3px var(--ball)}
.cell.marked{background:var(--dauber);color:#fff;box-shadow:none}
.cell.marked::after{content:"";position:absolute;inset:18%;border-radius:50%;border:3px solid rgba(255,255,255,.55)}
.cell.free{font-size:clamp(10px,4cqw,13px);background:var(--ball);box-shadow:none}
.cell.win{background:var(--win);color:#fff}
.cardlabel{text-align:center;color:var(--muted);font-size:13px;margin-top:8px}

/* called-number board */
.board{background:var(--paper);border-radius:14px;padding:8px;box-shadow:0 5px 0 var(--hall-deep);display:grid;grid-template-columns:repeat(5,1fr);gap:3px;container-type:inline-size}
.board .bh{font-family:'Bowlby One',sans-serif;text-align:center;color:var(--dauber);font-size:18px}
.board .bn{text-align:center;border-radius:6px;background:#fff;color:#9AA8A0;font-size:clamp(11px,4.5cqw,15px);font-weight:800;padding:2px 0}
.board .bn.on{background:var(--ball);color:var(--ink)}
.board .bn.last{background:var(--dauber);color:#fff}

/* lobby */
.hint{color:var(--muted);font-size:13px;text-align:center}
.pgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;padding:2px}
.pc{border:0;border-radius:10px;height:38px;background:var(--paper);color:var(--ink);font:inherit;font-weight:800;font-size:14px;cursor:pointer}
.pc.taken{opacity:.28;cursor:not-allowed}
.pc.mine{background:var(--dauber);color:#fff}

/* controls */
.status{min-height:20px;text-align:center;font-weight:800;font-size:14px;flex:none}
.status.bad{color:#FF8FA3}
.status.good{color:var(--ball)}
.row{display:flex;gap:8px;flex:none}
button.btn{flex:1;border:0;border-radius:12px;padding:12px 4px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;background:var(--hall-deep);color:var(--paper);box-shadow:0 4px 0 #0E0820}
button.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0E0820}
button.btn.bingo{flex:2.2;background:var(--dauber);color:#fff;font-family:'Bowlby One',sans-serif;font-weight:400;font-size:20px;box-shadow:0 4px 0 #8A004B}
button.btn.primary{background:var(--dauber);color:#fff;box-shadow:0 4px 0 #8A004B}
button.btn:disabled{opacity:.45}

/* bottom sheet + setup */
#sheet{position:fixed;inset:0;background:rgba(10,5,20,.8);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheetbox{width:100%;max-width:480px;background:var(--hall);border-radius:18px 18px 0 0;padding:14px 14px 18px;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.sheetbox h3{margin:0;text-align:center;font-size:18px}
#setup,#wait{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;color:var(--muted);padding:20px}
#setup b{color:var(--ball)}
@media (prefers-reduced-motion:reduce){.ball.pop{animation:none}button.cell{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div class="brand">
    <div class="brand-am">መዝናኛ ቢንጎ</div>
    <div class="brand-motto">እየተዝናኑ ያሸንፉ</div>
    <div class="brand-motto-en">Win while having fun!</div>
  </div>

  <div id="setup" hidden>
    <b>Almost ready</b>
    <div>Paste your Firebase settings into <b>index.html</b> (the FIREBASE_CONFIG block near the top of the script), then reload.</div>
  </div>
  <div id="wait">Connecting…</div>

  <div id="main" hidden style="display:contents">
    <div class="infobar"><span id="roundLbl"></span><span id="timer"></span></div>
    <div class="greet" id="greet"></div>

    <div class="screen" id="lobby" hidden>
      <div id="lobbyBody"></div>
    </div>

    <div class="screen" id="game" hidden>
      <div class="caller">
        <div class="ball empty" id="ball">Waiting</div>
        <div class="callinfo">
          <div class="count" id="count">0 of 75 called</div>
          <div class="recent" id="recent"></div>
        </div>
      </div>
      <div class="cardbox" id="cardArea"></div>
    </div>

    <div class="status" id="status"></div>

    <div class="row" id="controls" hidden>
      <button class="btn" id="boardBtn">Board</button>
      <button class="btn" id="autoBtn">Auto: Off</button>
      <button class="btn bingo" id="bingoBtn" disabled>BINGO!</button>
    </div>
  </div>
</div>

<div id="sheet" hidden>
  <div class="sheetbox">
    <h3 id="sheetTitle"></h3>
    <div class="cardbox sm" id="sheetCard" style="align-self:center"></div>
    <div class="row">
      <button class="btn" id="sheetBack">Back</button>
      <button class="btn primary" id="sheetPlay">Play this cartela</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getDatabase, ref, onValue, remove, push, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

/* ====== 1. PASTE YOUR FIREBASE SETTINGS HERE ====== */
const FIREBASE_CONFIG = {
  apiKey: "PASTE_API_KEY",
  authDomain: "PASTE",
  databaseURL: "PASTE_DATABASE_URL",
  projectId: "PASTE",
  appId: "PASTE"
};
/* ================================================== */

const LOBBY_MS = 45000, CALL_MS = 4000, RESULT_MS = 12000, SLACK_MS = 1500, TOTAL_CARTELAS = 100;

// ==LOGIC START==
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffled(arr,rng){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const cardCache={}, seqCache={};
function cardFor(k){
  if(cardCache[k]) return cardCache[k];
  const rng=mulberry32(k*7919+17);
  const cols=[0,1,2,3,4].map(c=>shuffled(Array.from({length:15},(_,i)=>c*15+i+1),rng).slice(0,5));
  const card=Array.from({length:5},(_,r)=>cols.map(col=>col[r]));
  card[2][2]=0;
  return cardCache[k]=card;
}
function seqFor(seed){
  return seqCache[seed]||(seqCache[seed]=shuffled(Array.from({length:75},(_,i)=>i+1),mulberry32(seed)));
}
const LINES=(()=>{const L=[];for(let i=0;i<5;i++){L.push([0,1,2,3,4].map(k=>[i,k]));L.push([0,1,2,3,4].map(k=>[k,i]));}
  L.push([0,1,2,3,4].map(k=>[k,k]));L.push([0,1,2,3,4].map(k=>[k,4-k]));return L;})();
function lineWon(card,called,isMarked){
  return LINES.find(l=>l.every(([r,c])=>{const n=card[r][c];const ok=n===0||called.has(n);return ok&&(!isMarked||isMarked(r,c));}))||null;
}
function letterFor(n){return 'BINGO'[Math.floor((n-1)/15)];}
function mmss(ms){const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
// ==LOGIC END==

const $=id=>document.getElementById(id);
const tg=window.Telegram&&Telegram.WebApp;
let me, myName;
try{ if(tg){ tg.ready(); tg.expand(); } }catch(e){}
try{ tg&&tg.disableVerticalSwipes&&tg.disableVerticalSwipes(); }catch(e){}
try{ tg&&tg.setHeaderColor('#2A1B3D'); tg&&tg.setBackgroundColor('#2A1B3D'); }catch(e){}
(function(){
  let u=null; try{ u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user; }catch(e){}
  if(u){ me=String(u.id); myName=u.username?'@'+u.username:(u.first_name||'Player'); }
  else{
    let g=null; try{g=localStorage.getItem('gid');}catch(e){}
    if(!g){g='g'+Math.random().toString(36).slice(2,8);try{localStorage.setItem('gid',g);}catch(e){}}
    me=g; myName='Guest '+g.slice(-3);
  }
})();
const buzz=t=>{try{tg&&tg.HapticFeedback.notificationOccurred(t);}catch(e){}};
const tap=()=>{try{tg&&tg.HapticFeedback.impactOccurred('light');}catch(e){}};

let db, offset=0, cur=null, picks={}, claims={}, picksLoaded=false, unsubP=null, unsubC=null;
let marks={}, auto=false, showBoard=false, changing=false, claimSent=false, chosen=null, selected=null, winNotified=false;
let phase={name:'lobby',left:0}, lastSig='', flashMsg=null, advancing={id:0,at:0}, lastN=0;
const now=()=>Date.now()+offset;
const cm=()=>(cur&&cur.callMs)||CALL_MS;
const pickCount=()=>Object.keys(picks).length;

function myCartela(){
  const mine=Object.keys(picks).filter(k=>picks[k]&&picks[k].uid===me).map(Number);
  if(!mine.length) return null;
  return mine.includes(chosen)?chosen:mine[0];
}
function ballsAt(t){ if(t<cur.lobbyEnd) return 0; return Math.min(75,Math.floor((t-cur.lobbyEnd)/cm())+1); }
function calledSetOf(n){ return new Set(seqFor(cur.seed).slice(0,n)); }

function validClaim(cl){
  if(!cur||!cl||typeof cl.cartela!=='number'||typeof cl.t!=='number') return false;
  const p=picks[cl.cartela]; if(!p||p.uid!==cl.uid) return false;
  if(cl.t<cur.lobbyEnd||cl.t>now()+3000) return false;
  return !!lineWon(cardFor(cl.cartela),calledSetOf(ballsAt(cl.t+SLACK_MS)));
}
function findWinner(){
  const arr=Object.entries(claims).map(([k,v])=>Object.assign({k},v)).sort((a,b)=>(a.t-b.t)||(a.k<b.k?-1:1));
  for(const c of arr) if(validClaim(c)) return c;
  return null;
}
function computePhase(){
  const t=now(), L=cur.lobbyEnd;
  if(t<L) return {name:'lobby',left:L-t};
  const w=findWinner();
  if(w){
    const endAt=w.t+RESULT_MS;
    return t<endAt?{name:'over',win:w,left:endAt-t,n:ballsAt(w.t+SLACK_MS)}:{name:'finished'};
  }
  const lastEnd=L+75*cm()+4000;
  if(t<lastEnd) return {name:'play',n:ballsAt(t),left:lastEnd-t};
  if(t<lastEnd+RESULT_MS) return {name:'over',win:null,n:75,left:lastEnd+RESULT_MS-t};
  return {name:'finished'};
}

/* ---------- database ---------- */
function newRound(prevId){
  return {id:prevId+1,seed:Math.floor(Math.random()*2147483647),lobbyEnd:Date.now()+offset+LOBBY_MS,callMs:CALL_MS};
}
function ensureRound(){
  runTransaction(ref(db,'current'),c=>c===null?newRound(0):undefined).catch(()=>{});
}
function advance(){
  if(!cur) return;
  if(advancing.id===cur.id&&now()-advancing.at<4000) return;
  advancing={id:cur.id,at:now()};
  const oldId=cur.id;
  runTransaction(ref(db,'current'),c=>{
    if(c===null) return newRound(oldId);
    if(c.id===oldId) return newRound(oldId);
    return undefined;
  }).then(()=>{ remove(ref(db,'rounds/'+(oldId-2))).catch(()=>{}); }).catch(()=>{});
}
function switchRound(v){
  if(unsubP) unsubP(); if(unsubC) unsubC();
  cur=v; picks={}; claims={}; picksLoaded=false;
  marks={}; claimSent=false; chosen=null; selected=null; changing=false; winNotified=false; lastN=0; lastSig='';
  closeSheet();
  unsubP=onValue(ref(db,'rounds/'+v.id+'/picks'),s=>{picks=s.val()||{};picksLoaded=true;lastSig='';render();});
  unsubC=onValue(ref(db,'rounds/'+v.id+'/claims'),s=>{claims=s.val()||{};});
}
async function chooseCartela(k){
  if(!cur||phase.name!=='lobby'||phase.left<2500){ flash('Too late. Wait for the next round.','bad'); closeSheet(); return; }
  const roundId=cur.id;
  try{
    const res=await runTransaction(ref(db,'rounds/'+roundId+'/picks/'+k),c=>c===null?{uid:me,name:myName}:undefined);
    const val=res.snapshot.val();
    if(!(res.committed||(val&&val.uid===me))){ flash('Cartela #'+k+' was just taken. Pick another.','bad'); buzz('error'); closeSheet(); return; }
    chosen=k; changing=false;
    for(const o of Object.keys(picks)){ if(Number(o)!==k&&picks[o]&&picks[o].uid===me) remove(ref(db,'rounds/'+roundId+'/picks/'+o)).catch(()=>{}); }
    buzz('success'); closeSheet(); render();
  }catch(e){ flash('Connection problem. Try again.','bad'); closeSheet(); }
}
function pressBingo(){
  const mine=myCartela();
  if(!cur||phase.name!=='play'||mine===null||claimSent) return;
  const card=cardFor(mine), called=calledSetOf(phase.n);
  const line=lineWon(card,called,isMarked(card,called));
  if(!line){ flash('Not yet. Mark a full line of called numbers.','bad'); buzz('error'); return; }
  claimSent=true;
  push(ref(db,'rounds/'+cur.id+'/claims'),{uid:me,name:myName,cartela:mine,t:serverTimestamp()}).catch(()=>{claimSent=false;});
  flash('Bingo sent. Checking…','good'); render();
}

/* ---------- rendering ---------- */
function isMarked(card,called){
  return (r,c)=>{const n=card[r][c];return n===0||!!marks[r*5+c]||(auto&&called.has(n));};
}
function buildCard(card,o){
  const wrap=document.createElement('div'); wrap.className='card';
  const head=document.createElement('div'); head.className='head';
  for(const L of 'BINGO'){const d=document.createElement('div');d.textContent=L;head.appendChild(d);}
  const grid=document.createElement('div'); grid.className='grid';
  for(let r=0;r<5;r++) for(let c=0;c<5;c++){
    const n=card[r][c];
    const el=document.createElement(o.onTap&&n!==0?'button':'div');
    el.className='cell';
    if(n===0){el.classList.add('free');el.textContent='FREE';}
    else{
      el.textContent=n;
      if(o.called&&o.called.has(n)) el.classList.add('called');
      if(o.marked&&o.marked(r,c)) el.classList.add('marked');
      if(o.onTap) el.addEventListener('click',()=>o.onTap(r,c));
    }
    if(o.win&&o.win.some(([wr,wc])=>wr===r&&wc===c)) el.classList.add('win');
    grid.appendChild(el);
  }
  wrap.append(head,grid); return wrap;
}
function buildBoard(n){
  const called=calledSetOf(n), last=n>0?seqFor(cur.seed)[n-1]:0;
  const b=document.createElement('div'); b.className='board';
  for(const L of 'BINGO'){const d=document.createElement('div');d.className='bh';d.textContent=L;b.appendChild(d);}
  for(let i=0;i<15;i++) for(let c=0;c<5;c++){
    const num=c*15+i+1, d=document.createElement('div');
    d.className='bn'+(called.has(num)?' on':'')+(num===last?' last':'');
    d.textContent=num; b.appendChild(d);
  }
  return b;
}
function show(id){
  for(const x of ['wait','setup']) $(x).hidden=(x!==id);
  $('main').hidden=(id!=='main');
}
function renderLobby(mine){
  $('lobby').hidden=false; $('game').hidden=true; $('controls').hidden=true;
  const box=$('lobbyBody'); box.innerHTML='';
  if(mine!==null&&!changing){
    const h=document.createElement('div'); h.className='hint'; h.textContent='You are in! The game starts when the timer ends.';
    const cb=document.createElement('div'); cb.className='cardbox'; cb.style.margin='8px auto';
    cb.appendChild(buildCard(cardFor(mine),{}));
    const lab=document.createElement('div'); lab.className='cardlabel'; lab.textContent='Your cartela #'+mine;
    const ch=document.createElement('button'); ch.className='btn'; ch.style.margin='10px auto 0'; ch.style.display='block'; ch.style.width='60%'; ch.textContent='Change cartela';
    ch.onclick=()=>{changing=true;render();};
    box.append(h,cb,lab,ch);
  } else {
    const h=document.createElement('div'); h.className='hint'; h.style.marginBottom='8px';
    h.textContent='Pick a cartela (1–'+TOTAL_CARTELAS+'). Gray ones are taken.';
    const g=document.createElement('div'); g.className='pgrid';
    for(let k=1;k<=TOTAL_CARTELAS;k++){
      const b=document.createElement('button'); b.className='pc'; b.textContent=k;
      const p=picks[k];
      if(p&&p.uid!==me){b.classList.add('taken');b.disabled=true;}
      else{
        if(p&&p.uid===me) b.classList.add('mine');
        b.onclick=()=>openSheet(k);
      }
      g.appendChild(b);
    }
    box.append(h,g);
    if(mine!==null){
      const back=document.createElement('button'); back.className='btn'; back.style.margin='10px auto 0'; back.style.display='block'; back.style.width='60%'; back.textContent='Keep cartela #'+mine;
      back.onclick=()=>{changing=false;render();}; box.appendChild(back);
    }
  }
}
function renderGame(mine){
  $('lobby').hidden=true; $('game').hidden=false; $('controls').hidden=false;
  const n=phase.n||0, seq=seqFor(cur.seed), ball=$('ball');
  if(n===0){ball.className='ball empty';ball.innerHTML='Waiting';}
  else{
    const num=seq[n-1];
    ball.className='ball'; ball.innerHTML='<small>'+letterFor(num)+'</small><b>'+num+'</b>';
    if(n!==lastN){void ball.offsetWidth;ball.classList.add('pop');}
  }
  $('count').textContent=n+' of 75 called';
  $('recent').innerHTML=seq.slice(Math.max(0,n-6),Math.max(0,n-1)).reverse().map(x=>'<span>'+x+'</span>').join('');
  const area=$('cardArea'); area.innerHTML='';
  const called=calledSetOf(n);
  if(phase.name==='over'&&phase.win){
    const w=phase.win, card=cardFor(w.cartela);
    area.appendChild(buildCard(card,{called,marked:(r,c)=>{const v=card[r][c];return v===0||called.has(v);},win:lineWon(card,called)}));
    const lab=document.createElement('div'); lab.className='cardlabel'; lab.textContent='Winning cartela #'+w.cartela; area.appendChild(lab);
  } else if(mine===null||showBoard){
    area.appendChild(buildBoard(n));
  } else {
    const card=cardFor(mine);
    area.appendChild(buildCard(card,{
      called, marked:isMarked(card,called),
      onTap:(r,c)=>{ if(phase.name!=='play') return; marks[r*5+c]=!marks[r*5+c]; tap(); render(); }
    }));
  }
  $('boardBtn').textContent=(showBoard&&mine!==null)?'My card':'Board';
  $('boardBtn').disabled=(mine===null);
  $('autoBtn').textContent='Auto: '+(auto?'On':'Off');
  $('bingoBtn').disabled=!(mine!==null&&phase.name==='play'&&!claimSent);
}
function render(){
  if(!cur){show('wait');return;}
  show('main');
  phase=computePhase();
  const mine=myCartela(), inLobby=phase.name==='lobby';
  $('greet').textContent=mine!==null?('Good luck, '+myName+'!'):inLobby?('Welcome, '+myName+'! Pick your cartela.'):('Hi '+myName+', you can join the next round.');
  const pc=pickCount();
  $('roundLbl').textContent='Round '+cur.id+' · '+pc+' player'+(pc===1?'':'s');
  if(inLobby) renderLobby(mine); else renderGame(mine);
  updateTimer(); updateStatus();
}
function updateTimer(){
  if(!cur) return;
  const p=phase; let t='';
  if(p.name==='lobby') t='Starts in '+mmss(p.left);
  else if(p.name==='play') t='Ball '+p.n+' of 75';
  else if(p.name==='over') t='Next round in '+mmss(p.left);
  else t='…';
  $('timer').textContent=t;
}
function flash(text,cls){ flashMsg={text,cls,until:Date.now()+3000}; updateStatus(); }
function updateStatus(){
  const s=$('status'); let text='',cls='';
  if(flashMsg&&Date.now()<flashMsg.until){text=flashMsg.text;cls=flashMsg.cls||'';}
  else if(cur){
    const mine=myCartela();
    if(phase.name==='over'){
      if(phase.win){
        if(phase.win.uid===me){text='You won! Congratulations!';cls='good';}
        else text=phase.win.name+' won with cartela #'+phase.win.cartela;
      } else text='No winner this round.';
    } else if(phase.name==='play'){
      text=mine!==null?'Mark called numbers. Complete a line, then press BINGO!':'Round in progress. Join the next round.';
    }
  }
  s.textContent=text; s.className='status '+cls;
}

/* ---------- sheet ---------- */
function openSheet(k){
  selected=k; $('sheetTitle').textContent='Cartela #'+k;
  const box=$('sheetCard'); box.innerHTML=''; box.appendChild(buildCard(cardFor(k),{}));
  $('sheet').hidden=false;
}
function closeSheet(){ $('sheet').hidden=true; selected=null; }

/* ---------- tick ---------- */
function tick(){
  if(!cur) return;
  phase=computePhase();
  if(phase.name==='finished'||(phase.name!=='lobby'&&picksLoaded&&pickCount()===0)) advance();
  if(phase.name==='over'&&phase.win&&phase.win.uid===me&&!winNotified){winNotified=true;buzz('success');}
  const sig=cur.id+'|'+phase.name+'|'+(phase.n||0)+'|'+(phase.win?phase.win.k:'');
  if(sig!==lastSig){
    if(phase.name==='play'&&(phase.n||0)>lastN) tap();
    if(phase.name==='over') flashMsg=null;
    lastSig=sig; render(); lastN=phase.n||0;
  }
  updateTimer(); updateStatus();
}

/* ---------- start ---------- */
$('boardBtn').onclick=()=>{showBoard=!showBoard;render();};
$('autoBtn').onclick=()=>{auto=!auto;render();};
$('bingoBtn').onclick=pressBingo;
$('sheetBack').onclick=closeSheet;
$('sheetPlay').onclick=()=>{ if(selected!==null) chooseCartela(selected); };

if(!FIREBASE_CONFIG.apiKey||FIREBASE_CONFIG.apiKey.startsWith('PASTE')){ show('setup'); }
else{
  show('wait');
  db=getDatabase(initializeApp(FIREBASE_CONFIG));
  onValue(ref(db,'.info/serverTimeOffset'),s=>{offset=s.val()||0;});
  onValue(ref(db,'current'),s=>{
    const v=s.val();
    if(!v){ensureRound();return;}
    if(!cur||cur.id!==v.id) switchRound(v); else cur=v;
    render();
  });
  setInterval(tick,250);
}
</script>
</body>
